services:
  - type: web
    name: holdfast-protocol-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@holdfast/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RECEIPT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
