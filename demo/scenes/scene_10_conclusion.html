<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 10: Conclusion</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: radial-gradient(circle at 50% 40%, #0d192e 0%, #060b13 70%, #03060a 100%);
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    text-align: center;
  }
  .grid-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      linear-gradient(rgba(14, 165, 233, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14, 165, 233, 0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.6;
  }
  .glow {
    position: absolute;
    width: 700px;
    height: 350px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.2) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
    filter: blur(50px);
    pointer-events: none;
  }
  .pill {
    display: inline-block;
    padding: 8px 24px;
    background: rgba(56, 189, 248, 0.1);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 9999px;
    color: #38bdf8;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 28px;
    z-index: 1;
  }
  h1 {
    font-size: 76px;
    font-weight: 800;
    letter-spacing: -2px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    z-index: 1;
  }
  .tagline {
    font-size: 32px;
    color: #38bdf8;
    font-weight: 400;
    margin-bottom: 40px;
    z-index: 1;
  }
  .footer-box {
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 16px 36px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    z-index: 1;
    backdrop-filter: blur(8px);
  }
  .footer-item {
    font-size: 18px;
    color: #cbd5e1;
    font-weight: 500;
  }
  .footer-item strong {
    color: #ffffff;
  }
  .sep {
    color: #475569;
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>
<div class="pill">PayPal Opportunity Hackathon 2026</div>
<h1>Holdfast Protocol</h1>
<div class="tagline">Verifiable safeguards for AI-powered commerce</div>
<div class="footer-box">
  <div class="footer-item"><strong>Open-Source Project</strong></div>
  <div class="sep">•</div>
  <div class="footer-item">github.com/faizkhatri196/PayPal-Hackthon</div>
  <div class="sep">•</div>
  <div class="footer-item">MIT License</div>
</div>
</body>
</html>
