name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (Money Invariants & Proof Suite)
        run: npm test
        env:
          PORT: 4000
          NODE_ENV: test
          RECEIPT_SECRET: holdfast_receipt_hmac_secret_2026

      - name: Build All Workspaces
        run: npm run build
